[package]
name = "fast-avif-cli"
version = "1.1.0"
edition = "2021"
default-run = "dav1d"
description = "The conformance runner: IVF, Section 5 and Annex B streams decoded to an md5"
license = "BSD-2-Clause"
publish = false

[[bin]]
path = "dav1d.rs"
name = "dav1d"

[dependencies]
fast-avif = { path = "../", version = "1.1.0", default-features = false }

[features]
default = ["bitdepth_8", "bitdepth_16"]
bitdepth_8 = ["fast-avif/bitdepth_8"]
bitdepth_16 = ["fast-avif/bitdepth_16"]
