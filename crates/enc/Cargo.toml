[package]
name = "fast-avif-enc"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
description = "The AV1 still-image encoder of fast-avif"
repository = "https://github.com/marcbachmann/fast-avif"
license = "BSD-2-Clause"
publish = false

[dependencies]
fast-avif-shared = { path = "../shared", version = "1.1.0" }
strum = { version = "0.27", features = ["derive"] }

[dev-dependencies]
# The tests decode what they code.
fast-avif-dec = { path = "../dec", version = "1.1.0", features = ["encoder"] }
