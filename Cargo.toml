[workspace]
members = [".", "tools", "crates/shared", "crates/dec", "crates/enc"]
default-members = [".", "tools"]

[workspace.dependencies]
cfg-if = "1.0.0"

[package]
name = "fast-avif"
authors = ["Rav1d Developers", "Prossimo"]
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
description = "AV1 still-image encoder and decoder for AVIF, in Rust only"
license = "BSD-2-Clause"
repository = "https://github.com/marcbachmann/fast-avif"
readme = "README.md"
keywords = ["avif", "av1", "image", "encoder", "decoder"]
categories = ["multimedia::images", "multimedia::encoding"]
exclude = ["*.c", "*.h", "*.in", "meson*", "tests/", "doc/"]

[dependencies]
fast-avif-shared = { path = "crates/shared", version = "1.1.0" }
fast-avif-dec = { path = "crates/dec", version = "1.1.0", default-features = false }
fast-avif-enc = { path = "crates/enc", version = "1.1.0", optional = true }

[features]
default = ["bitdepth_8", "bitdepth_16"]
bitdepth_8 = ["fast-avif-dec/bitdepth_8"]
bitdepth_16 = ["fast-avif-dec/bitdepth_16"]
encoder = ["dep:fast-avif-enc", "fast-avif-dec/encoder"]

[profile.dev]
panic = "abort"

[profile.opt-dev]
# The debug builds run tests very slowly so this profile keeps debug assertions
# while enabling basic optimizations. The profile is not suitable for debugging.
inherits = "dev"
opt-level = 1

[profile.release]
codegen-units = 1
panic = "abort"
lto = "fat"

[profile.release-with-debug]
inherits = "release"
debug = "line-tables-only"

[profile.checked-release]
# Close to a release build, but with all checks enabled.
inherits = "dev"
opt-level = 2
codegen-units = 16
